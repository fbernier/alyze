name: CI

on:
  push:
    branches: [trunk]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo fmt --all --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      # alyze + alyze-features; alyze-wasm targets wasm32 and isn't host-testable.
      - run: cargo test --workspace --exclude alyze-wasm

  # The word-continue scan is selected by `cfg`, so the host `test` job above exercises exactly one
  # of its backends. wasm32 is the portable-SWAR target and the only one where `WORD_BYTES` is 4
  # rather than 8 — every SWAR mask changes width with it — so keep it compiling at least.
  # Run from `wasm/` so its `.cargo/config.toml` (the getrandom wasm backend) applies; that is also
  # how the package is really built.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo check --target wasm32-unknown-unknown
        working-directory: wasm

  # Build every crate on exactly the toolchain named in `rust-version`. Without this the floor is
  # never exercised (every other job runs `stable`), which is how the crate drifted onto let-chains
  # (stabilized in 1.88) while still claiming 1.85.
  #
  # `python/` and `node/` are deliberately separate one-member workspaces, so `--workspace` skips
  # them and their floor would go unchecked; they get their own `check`. `check` (not `build`)
  # because it skips linking, which is what makes the PyO3 `extension-module` crate checkable here.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.88 --profile minimal
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo +1.88 check --workspace
      - run: cargo +1.88 check --manifest-path python/Cargo.toml
      - run: cargo +1.88 check --manifest-path node/Cargo.toml
